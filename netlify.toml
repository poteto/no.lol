# Node.js version comes from .nvmrc.
[build]
  # TEMPORARY: diagnostics wrapper around `yarn build`, see scripts/netlify-diagnose.sh
  command = "bash scripts/netlify-diagnose.sh"
  publish = "public"
  # TEMPORARY: pre-install environment probe; always exits 1 so the build continues
  ignore = "bash ./scripts/netlify-probe.sh"

# TEMPORARY: reports build stages and the build error, see netlify/diagnose-plugin
[[plugins]]
  package = "./netlify/diagnose-plugin"

[build.environment]
  # Netlify pinned this site to the Ruby version of its original (2019) build
  # image. That Ruby is not preinstalled on the current Ubuntu 24.04 image, so
  # every build spent 4 minutes trying to compile it and then failed with
  # "Failed to install ruby version". Nothing here needs Ruby; use the version
  # the image ships so rvm activates it instantly.
  RUBY_VERSION = "3.4.8"
  # Netlify passes --ignore-optional to yarn by default. Gatsby 5 needs the
  # optional, platform-specific native packages (@parcel/watcher-linux-x64-glibc,
  # @lmdb/lmdb-linux-x64, msgpackr-extract) or `gatsby build` fails at startup.
  YARN_FLAGS = "--no-ignore-optional"
  # The build image ships a system libvips. Make sharp use its prebuilt binary
  # instead of compiling itself from source against the system library.
  SHARP_IGNORE_GLOBAL_LIBVIPS = "true"
