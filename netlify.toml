# Node.js version comes from .nvmrc.
[build]
  command = "yarn build"
  publish = "public"

[build.environment]
  # Netlify pinned this site to the Ruby version of its original (2019) build
  # image (2.7.2). That Ruby is not preinstalled on the current Ubuntu 24.04
  # image, so every build spent 4 minutes trying to compile it and then failed
  # with "Error setting ruby version". Nothing here needs Ruby; use the version
  # the image ships so mise activates it instantly.
  RUBY_VERSION = "3.4.8"
  # --pure-lockfile is Netlify's default. Never let --ignore-optional in: Gatsby 5
  # ships its native binaries as optional, platform-specific packages
  # (@parcel/watcher-linux-x64-glibc, @lmdb/lmdb-linux-x64, msgpackr-extract)
  # and `gatsby build` fails at startup without them.
  YARN_FLAGS = "--pure-lockfile --no-ignore-optional"
  # The build image ships a system libvips. Make sharp use its prebuilt binary
  # instead of compiling itself from source against the system library.
  SHARP_IGNORE_GLOBAL_LIBVIPS = "true"

# The Lighthouse plugin was installed from the Netlify UI years ago, and Netlify
# pinned it to major version 4 there. v4 requires Node < 20 and its install dies
# on the current build image, which failed every build before the build command
# ran. A netlify.toml entry overrides the UI pin. Uninstall the plugin in the
# Netlify UI and delete this block if you do not want Lighthouse runs.
[[plugins]]
  package = "@netlify/plugin-lighthouse"
  pinned_version = "6"
